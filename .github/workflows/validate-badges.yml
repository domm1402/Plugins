name: Validate custom badges

on:
  push:
    branches: [main]
    paths:
      - 'plugins/domms-custom-badges/**'
      - 'build.gradle.kts'
      - 'package.json'
      - 'bun.lock'
      - 'gradle/**'
      - '.github/workflows/validate-badges.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  build-badges:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - name: Install JavaScript dependencies
        run: bun install
      - name: Build only Domms Custom Badges
        run: ./gradlew --no-daemon packageDommsCustomBadges
        env:
          GITHUB_TOKEN: ${{ secrets.READ_PACKAGES_TOKEN || github.token }}
