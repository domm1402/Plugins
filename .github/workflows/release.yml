name: Release Domms Custom Badges

on:
  push:
    branches: [main]
    paths:
      - 'plugins/domms-custom-badges/**'
      - 'repo.config.json'
      - 'package.json'
      - 'bun.lock'
      - 'build.gradle.kts'
      - '.github/workflows/release.yml'
  workflow_dispatch:

concurrency:
  group: publish-pool
  cancel-in-progress: false

permissions:
  contents: write
  packages: read

env:
  POOL_BRANCH: gh-pages
  POOL_CHECKOUT: published
  PAGES_BASE_URL: https://domm1402.github.io/Plugins
  POOL_REMOTE: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git

jobs:
  release-badges:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Install JavaScript dependencies
        run: bun install

      - name: Check out published plugin pool
        run: .github/scripts/checkout-pool.sh

      - name: Build only Domms Custom Badges
        run: ./gradlew --no-daemon packageDommsCustomBadges
        env:
          GITHUB_TOKEN: ${{ secrets.READ_PACKAGES_TOKEN || github.token }}

      - name: Publish plugin ZIP and regenerate index.json
        run: |
          . .github/scripts/lib.sh
          mkdir -p "$POOL_CHECKOUT/pool"
          cp "build/dist/domms.custom-badges@1.0.2.zip" "$POOL_CHECKOUT/pool/"
          bun run generate-index --dist "$POOL_CHECKOUT/pool" --base-url "$(pages_base_url)/pool" --out "$POOL_CHECKOUT/index.json"
          git -C "$POOL_CHECKOUT" add pool index.json
          git -C "$POOL_CHECKOUT" config user.name 'github-actions[bot]'
          git -C "$POOL_CHECKOUT" config user.email 'github-actions[bot]@users.noreply.github.com'
          if git -C "$POOL_CHECKOUT" diff --cached --quiet; then
            echo "Published pool already up to date."
          else
            git -C "$POOL_CHECKOUT" commit -m "Publish Domms Custom Badges 1.0.2"
            git -C "$POOL_CHECKOUT" push origin "$POOL_BRANCH"
          fi
